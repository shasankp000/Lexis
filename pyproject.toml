[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexis-e"
version = "0.1.0"
description = "Lexis-E — semantic compression pipeline with spaCy NLP backend"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

# All runtime deps that must be present in .venv2.
# Versions are soft lower-bounds so they don't fight spaCy's transitive pins.
# The tighter upper-bounds from the original requirements.txt that are needed
# for fastcoref / huggingface-hub compatibility are preserved where critical.
dependencies = [
    "spacy>=3.8",
    "msgpack>=1.0",
    "lemminflect",
    "transformers==4.40.2",
    "tokenizers==0.19.1",
    "huggingface-hub==0.23.5",
    "accelerate==0.30.1",
    "safetensors==0.4.3",
    "fastcoref==2.1.6",
    "datasets",
]

[project.optional-dependencies]
# Install test deps with:  pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
]

# ---------------------------------------------------------------------------
# Package discovery
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
# Auto-discover all packages rooted at the repo root.
# This picks up:
#   compression
#   compression.alphabet
#   compression.pipeline
#   compression.tests   (excluded below in prod installs)
where = ["."]
include = ["compression*"]
exclude = ["compression.tests*"]

# Make root-level modules (main, pipeline_trace, etc.) importable too.
# They are exposed under the top-level namespace, e.g.:
#   import main          -> Lexis entry point
#   import pipeline_trace
# Because these are plain .py files at the repo root, setuptools needs to
# be told about them explicitly via py-modules.
[tool.setuptools]
py-modules = [
    "main",
    "pipeline_trace",
    "debug_roundtrip",
    "scaling_test",
    "codec_unit_test",
    "compression_test",
    "test_discourse",
    "test_round_trip_pipeline",
    "eval_fineweb_bpb",
]
